{% extends "base.html" %}

{% block title %}Login do Administrador{% endblock %}
{% block body_class %}painel-login-adm{% endblock %}

{% block content %}
<div class="login-container" id="admin-login">
    <div class="logo">
        <span style="color: #000000; font-weight: bold;">S</span>
        <span class="tight-x" style="color: #ff0000; font-weight: bold;">X</span>
        <span style="color: #000000; font-weight: bold;">69</span>
    </div>
    
    <h1>Login do Administrador</h1>
    <form action="/admin/hidden_access" method="POST">
        <label for="username">Nome de Usuário:</label>
        <input type="text" id="username" name="username" required>
        <br>
        <label for="password">Senha:</label>
        <input type="password" id="password" name="password" required>
        <br>
        <button type="submit">Entrar</button>
    </form>
</div>
{% endblock %}
